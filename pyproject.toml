[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traque-bots"
version = "0.1.0"
description = "Prototype hors ligne de detection et de triage de campagnes sociales coordonnees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "Flask>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traque_bots = ["templates/*.html", "static/*.css", "static/*.js"]
